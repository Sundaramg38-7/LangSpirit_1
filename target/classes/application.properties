server.port=8080
server.error.include-message=always

# ---- Database: H2 (file based, no installation needed) ----
spring.datasource.url=jdbc:h2:file:./data/langdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- To use MySQL instead: add mysql-connector-j to pom.xml and replace the lines above with ----
# spring.datasource.url=jdbc:mysql://localhost:3306/langdb?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.hibernate.ddl-auto=update
